# System-wide defaults for new users; each user's choices go to ~/.config/credo/credo.conf
[general]
language = en

[appearance]
variant = liturgical
logo = chirho
# mac = menu bar on top + floating dock; classic = one taskbar
layout = mac
# the dock (or taskbar):
panel_position = bottom
panel_height = 60
panel_floating = true
wallpaper = true
# the approved design has a quiet watermark and no motto
motto = false

[library]
port = 8754
